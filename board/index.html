<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>2학년 3반 교실 화면</title>
  <link rel="icon" href="../snack_icon_full.png">
  <link rel="stylesheet" href="board.css?v=20260928-connect1">
</head>
<body>
  <main id="setupView" class="setup-shell">
    <section class="setup-card">
      <p class="eyebrow">2학년 3반</p>
      <h1>호출 연결</h1>
      <p class="muted">호출키를 한 번 넣으면 이 컴퓨터의 학급 알림장 위쪽에 호출이 뜹니다.</p>

      <!-- 이미 연결된 기기에서 다시 들어왔을 때 -->
      <div id="connectedBox" class="connected-box hidden">
        <p class="connected-mark">✅ 이 컴퓨터는 호출에 연결되어 있어요</p>
        <a class="primary full button-link" href="../">학급 알림장으로 가기</a>
        <button id="disconnectBtn" class="ghost full" type="button">연결 해제</button>
      </div>

      <form id="setupForm" class="setup-form">
        <label for="keyInput">호출키
          <input id="keyInput" type="password" autocomplete="off" required autofocus>
        </label>
        <button class="primary full" type="submit">연결하고 학급 알림장으로</button>
        <button id="boardOnlyBtn" class="ghost full" type="button">이 화면에서 크게 보기</button>
      </form>
      <p id="setupError" class="form-error" role="alert"></p>
      <p class="hint">학급 알림장으로 돌아가면 화면 위쪽에 "호출 연결됨"이 보입니다.
        알림음은 알림장에서 <b>🔊 알림음 켜기</b>를 한 번 눌러야 납니다.</p>
      <a class="text-link" href="../">학급 알림장으로 가기</a>
    </section>
  </main>

  <div id="boardView" class="board hidden">
    <header class="board-top">
      <div>
        <p class="eyebrow">2학년 3반</p>
        <h1>호출</h1>
      </div>
      <div class="board-meta">
        <span id="clock" class="clock">--:--</span>
        <span id="status" class="status">연결 확인 중</span>
        <button id="notifyBtn" class="ghost hidden" type="button">알림 켜기</button>
      </div>
    </header>

    <section id="callList" class="call-list" aria-live="polite" aria-label="호출 목록"></section>

    <section id="emptyState" class="empty">
      <p class="empty-mark">호출 없음</p>
      <p class="muted">선생님이 부르시면 이 화면에 크게 뜹니다.</p>
    </section>

    <footer class="board-foot">
      <span id="doneList" class="done-list"></span>
    </footer>
  </div>

  <script src="../config.js?v=20260923-board1"></script>
  <script src="../call-feed.js?v=20260928-connect3"></script>
  <script src="board.js?v=20260928-connect3"></script>
</body>
</html>
