<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4361ee">
  <title>2학년 3반 지각 체크</title>
  <link rel="icon" href="../snack_icon_full.png">
  <link rel="stylesheet" href="late.css?v=20260928-late1">
</head>
<body>
  <main id="setupView" class="shell">
    <section class="card setup">
      <p class="eyebrow">2학년 3반</p>
      <h1>지각 체크</h1>
      <p class="muted">지각 체커용 화면이에요. 비밀번호는 이 기기에 저장돼서 다음부터는 바로 열려요.</p>
      <form id="setupForm" class="setup-form">
        <label for="keyInput">지각 체크 비밀번호
          <input id="keyInput" type="password" autocomplete="off" required autofocus>
        </label>
        <button class="primary full" type="submit">열기</button>
      </form>
      <p id="setupError" class="form-error" role="alert"></p>
      <a class="text-link" href="../">학급 알림장으로 가기</a>
    </section>
  </main>

  <main id="mainView" class="shell hidden">
    <header class="top">
      <div>
        <p class="eyebrow">2학년 3반</p>
        <h1>지각 체크</h1>
      </div>
      <span id="status" class="status">불러오는 중</span>
    </header>

    <section class="card">
      <div class="date-row">
        <button id="prevDay" class="ghost icon" type="button" aria-label="전날">‹</button>
        <div class="date-label">
          <b id="dateLabel">-</b>
          <button id="todayBtn" class="link-btn" type="button">오늘로</button>
        </div>
        <button id="nextDay" class="ghost icon" type="button" aria-label="다음 날">›</button>
      </div>
      <p class="muted small">지각한 친구 번호를 누르세요. 한 번 더 누르면 취소돼요.</p>
      <div id="numberGrid" class="number-grid" aria-label="번호 선택"></div>
      <p id="daySummary" class="summary"></p>
    </section>

    <section class="card">
      <h2>🧺 목요일 분리수거</h2>
      <p class="muted small">수요일 아침에 지각 순서대로 <b id="perWeek">2</b>명이 정해지고 학급 알림장에 공지돼요. 분리수거를 마친 친구는 완료를 눌러주세요.</p>
      <div id="dutyList" class="duty-list"></div>
      <h3>다음 순서</h3>
      <p id="queueList" class="queue"></p>
    </section>

    <p class="foot">
      <a class="text-link" href="../">학급 알림장</a>
      <button id="forgetBtn" class="link-btn" type="button">이 기기에서 비밀번호 지우기</button>
    </p>
  </main>

  <script src="../config.js"></script>
  <script src="late.js?v=20260928-late1"></script>
</body>
</html>
