<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학년 3반 학급 안내사항</title>
<style>
  :root{
    --primary:#4361ee;
    --primary-light:#eef1ff;
    --danger:#e63946;
    --warning:#f4a261;
    --success:#2a9d8f;
    --gray-bg:#f6f7fb;
    --border:#e5e7f0;
    --text:#222639;
    --text-sub:#7a7f95;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--gray-bg);
    color:var(--text);
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:#fff;
    box-shadow:0 0 24px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:#fff;
    z-index:10;
  }
  header .title-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .app-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    object-position:center center;
    flex-shrink:0;
    border:2px solid var(--primary-light);
  }
  header .title{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  header .sub{
    font-size:13px;
    color:var(--text-sub);
    margin-top:2px;
  }

  section{padding:18px 20px;}
  section + section{border-top:8px solid var(--gray-bg);}
  .section-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .section-title .badge{
    font-size:11px;
    background:var(--primary-light);
    color:var(--primary);
    padding:2px 7px;
    border-radius:10px;
    font-weight:600;
  }
  .section-title .badge.unread{
    background:#ffe3e5;
    color:var(--danger);
  }

  /* 개인 코드 확인 영역 */
  .identity-box{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    background:var(--gray-bg);
  }
  .identity-box .id-label{
    font-size:12.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .identity-row{display:flex; gap:8px;}
  .identity-row input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    letter-spacing:2px;
  }
  .identity-row button{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .identity-msg{
    font-size:11.5px;
    color:var(--danger);
    margin-top:6px;
    min-height:14px;
  }
  .identity-chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
  }
  .identity-chip b{color:var(--primary);}
  .identity-chip button{
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* 오늘의 안내 */
  .notice-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
    position:relative;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .notice-card.urgent{border-color:#ffd2d6;background:#fff7f7;}
  .notice-card.done .ntitle{color:var(--text-sub);}
  .notice-checkbox{
    width:20px;
    height:20px;
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    accent-color:var(--primary);
  }
  .checkbox-placeholder{
    width:20px;
    height:20px;
    flex-shrink:0;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-sub);
    font-size:11px;
    border:1px dashed var(--border);
    border-radius:5px;
    cursor:not-allowed;
  }
  .task-item .checkbox-placeholder{margin-top:0;}
  .notice-body{flex:1; min-width:0;}
  .notice-card .ntitle{
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .notice-card .ntitle .tag{
    font-size:10px;
    padding:2px 6px;
    border-radius:6px;
    font-weight:700;
  }
  .tag.all{background:#e8eefc;color:var(--primary);}
  .tag.personal{background:#fff1e6;color:var(--warning);}
  .tag.urgent{background:#ffe3e5;color:var(--danger);}
  .notice-card .ncontent{
    font-size:13px;
    color:#4a4e63;
    line-height:1.5;
  }
  .notice-card .ndate{
    font-size:11px;
    color:var(--text-sub);
    margin-top:6px;
  }
  .notice-card .unread-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--danger);
    display:inline-block;
    flex-shrink:0;
  }
  .tag.new{background:#ffe3e5;color:var(--danger);}

  /* 오늘의 안내: 날짜 이동 */
  .notice-datenav{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:12px;
  }
  .notice-datenav button.nd-arrow{
    border:none;
    background:var(--gray-bg);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .notice-datenav .nd-label{
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
    flex:1;
    text-align:center;
    white-space:nowrap;
  }
  .notice-datenav .nd-label:hover{background:var(--gray-bg);}
  .notice-datenav .nd-label .nd-badge{
    font-size:11px;
    font-weight:700;
    color:var(--primary);
    margin-left:5px;
  }
  .notice-datenav .nd-input{
    font-size:13px;
    font-weight:700;
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px 6px;
    color:var(--text);
    flex:1;
  }

  .file-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:8px;
    padding:6px 10px;
    background:var(--primary-light);
    color:var(--primary);
    border-radius:8px;
    font-size:12px;
    font-weight:600;
    text-decoration:none;
  }
  .file-btn:hover{background:#dfe6fd;}

  .notice-subheader{
    font-size:11.5px;
    font-weight:700;
    color:var(--text-sub);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }

  .archive-toggle{
    width:100%;
    text-align:center;
    padding:10px;
    margin-top:4px;
    background:var(--gray-bg);
    border:1px dashed var(--border);
    border-radius:10px;
    font-size:12.5px;
    color:var(--text-sub);
    cursor:pointer;
  }
  .archive-toggle:hover{background:#eceefa;}
  #archiveList{margin-top:10px;display:none;}
  .notice-card.archived{opacity:0.75;}

  /* 달력 */
  .calendar{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:8px;
  }
  .cal-nav{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cal-header button{
    border:none;
    background:var(--gray-bg);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .today-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:11.5px;
    font-weight:700;
    width:auto !important;
    padding:0 10px;
    height:28px;
    border-radius:8px;
    cursor:pointer;
    flex-shrink:0;
  }
  .cal-header .ym{font-size:14px;font-weight:700;cursor:pointer;}
  .month-jump-input{
    font-size:14px;
    font-weight:700;
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px 6px;
    color:var(--text);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    text-align:center;
  }
  .cal-grid .dow{
    font-size:11px;
    color:var(--text-sub);
    padding-bottom:4px;
  }
  .cal-day{
    position:relative;
    min-height:38px;
    height:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    border-radius:8px;
    cursor:default;
    color:var(--text);
    padding:3px 1px;
  }
  .cal-day.has-label{
    flex-direction:column;
    gap:1px;
  }
  .cal-day .day-label{
    font-size:7px;
    line-height:1.1;
    font-weight:700;
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{background:var(--primary);color:#fff;font-weight:700;}
  .cal-day .dot{
    position:absolute;
    bottom:4px;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--danger);
  }
  .cal-day.has-event:not(.today){background:var(--primary-light);}
  .cal-day.has-event{cursor:pointer;}
  .cal-day.selected{outline:2px solid var(--primary);}

  .cal-day.sunday{color:var(--danger);}
  .cal-day.saturday{color:#2b6cb0;}
  .cal-day.holiday{color:var(--danger); font-weight:700;}
  .cal-day.range-holiday:not(.today){background:#ffe3e5;}
  .cal-day.range-exam:not(.today){background:#fff3b0;}
  .cal-day.range-prep:not(.today){background:#e3f2fd;}
  .cal-day.range-vacation{background:#eceef2; color:#b4b8c4; cursor:default;}
  .cal-day.today{background:var(--primary) !important; color:#fff !important; font-weight:700;}

  .day-detail{
    margin-top:12px;
    padding:12px 14px;
    background:var(--gray-bg);
    border-radius:10px;
    display:none;
  }
  .day-detail .dd-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
  }
  .day-detail ul{
    margin:0;
    padding-left:18px;
    font-size:12.5px;
    color:#4a4e63;
    line-height:1.6;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    margin-top:10px;
    font-size:10.5px;
    color:var(--text-sub);
  }
  .legend span{display:flex;align-items:center;gap:4px;}
  .legend i{width:9px;height:9px;border-radius:3px;background:var(--danger);display:inline-block;}
  .legend i.holiday{background:#ffe3e5;border:1px solid #ffc2c8;}
  .legend i.exam{background:#fff3b0;border:1px solid #f0dc7a;}
  .legend i.prep{background:#e3f2fd;border:1px solid #bfe0fa;}
  .legend i.vacation{background:#eceef2;border:1px solid #d8dae0;}
  .legend i.sat,.legend i.sun{
    width:auto;height:auto;border-radius:0;background:none;border:none;
    font-weight:700;font-style:normal;font-size:11px;
  }
  .legend i.sat{color:#2b6cb0;}
  .legend i.sun{color:var(--danger);}

  /* 제출 현황 */
  .task-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .task-item:last-child{border-bottom:none;}
  .task-info{flex:1;}
  .task-title{font-size:13.5px;font-weight:600;margin-bottom:3px;}
  .task-due{font-size:11.5px;color:var(--text-sub);}
  .status-pill{
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .status-pill.ongoing{background:#e8f6f4;color:var(--success);}
  .status-pill.soon{background:#fff4e6;color:var(--warning);}
  .status-pill.closed{background:#f1f1f4;color:#9297a8;}
  .status-pill.done{background:#e8f6f4;color:var(--success);}
  .status-pill.overdue{background:#ffe3e5;color:var(--danger);}

  .task-item.overdue{
    background:#fff7f7;
    border-radius:10px;
    padding-left:8px;
    padding-right:8px;
    margin:2px 0;
  }
  .task-item.overdue .task-title{color:var(--danger); font-weight:700;}

  .task-checkbox{
    width:20px;
    height:20px;
    flex-shrink:0;
    cursor:pointer;
    accent-color:var(--primary);
  }
  .task-item.done .task-title{
    text-decoration:line-through;
    color:var(--text-sub);
  }
  .section-sub{
    font-size:11.5px;
    color:var(--text-sub);
    margin:-6px 0 12px;
  }

  .empty-state{
    text-align:center;
    color:var(--text-sub);
    font-size:13px;
    padding:20px 0;
  }
  footer{
    padding:16px 20px 24px;
    text-align:center;
    font-size:11px;
    color:var(--text-sub);
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-row">
      <img class="app-icon" src="snack_icon_full.png" alt="">
      <div class="title">2학년 3반 학급 안내사항:D</div>
    </div>
    <div class="sub" id="headerDate">-</div>
  </header>

  <section>
    <div class="section-title">📢 학급 안내사항 <span class="badge" id="noticeCount">0</span></div>
    <div class="section-sub">종료일까지 한곳에 표시되고, 다음 날 지난 공지로 자동 이동합니다.</div>
    <div id="noticeList"></div>
    <button class="archive-toggle" id="archiveToggle" onclick="toggleArchive()">지난 공지 보기</button>
    <div id="archiveList"></div>
  </section>

  <section>
    <div class="section-title">🔑 내 개인 공지 확인하기</div>
    <div class="identity-box" id="identityBox"></div>
  </section>

  <section>
    <div class="section-title">📅 일정 달력</div>
    <div class="calendar">
      <div class="cal-header">
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <div class="ym" id="calYm" onclick="openMonthJump()"></div>
          <input type="month" id="monthJumpInput" class="month-jump-input" style="display:none"
            onchange="jumpToMonth(this.value)" onblur="hideMonthJump()">
          <button onclick="changeMonth(1)">›</button>
        </div>
        <button class="today-btn" onclick="goToToday()">오늘</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><i class="sat">토</i> 토요일</span>
        <span><i class="sun">일</i> 일요일·공휴일</span>
        <span><i class="exam"></i> 고사기간</span>
        <span><i class="prep"></i> 집중준비기간</span>
        <span><i class="vacation"></i> 방학주간</span>
      </div>
      <div class="day-detail" id="dayDetail">
        <div class="dd-title" id="dayDetailTitle"></div>
        <ul id="dayDetailList"></ul>
      </div>
    </div>
  </section>

  <section>
    <div class="section-title">✅ 제출 / 할 일 현황</div>
    <div class="section-sub" id="taskSub"></div>
    <div id="taskList"></div>
  </section>

  <footer>매일 자동으로 마감 여부가 갱신됩니다</footer>
</div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="notice-logic.js?v=20260816-order1"></script>
<script>
let currentStudent = null;
let calDate = new Date();

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function safeUrl(value){
  try{
    const raw = String(value || '').trim();
    if(!raw) return '';
    const url = new URL(raw, location.href);
    return /^https?:$/.test(url.protocol) ? url.href : '';
  }catch(e){ return ''; }
}
function todayStr(){ return fmtDate(new Date()); }
function shiftDateStr(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return fmtDate(d);
}
function labelDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;
}

/* ===================== 개인 코드 확인 ===================== */
const MYCODE_KEY = 'classNoticeApp_myCode';
/* 구글시트 문지기(Apps Script) 웹앱 엔드포인트. 개인정보(이름·코드·명단)는 여기서 안 나옴. */
const SHEET_API = window.CLASS_NOTICE_CONFIG.apiUrl;

/* 공지/할일은 서버에서 받아온다(정적 data.js가 아님). */
let notices = [];
let tasks = [];

/* 코드 정규화: 숫자만 남기고 왼쪽을 0으로 채워 6자리로.
   (1번 학생이 "19596"만 쳐도 "019596"으로 인식됨) */
function normalizeCode(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length < 6) d = d.padStart(6,'0');
  return d;
}

/* 서버(구글시트 문지기)에서 공지/할일을 가져온다.
   code가 있으면 전체+본인 것, 없거나 틀리면 전체만. 대상 필터는 서버가 처리. */
async function loadData(code){
  const url = SHEET_API + (code ? ('?code=' + encodeURIComponent(code)) : '');
  const r = await fetch(url);
  if(!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
  const d = await r.json();
  if(!d || !d.ok) throw new Error('데이터 형식 오류');
  notices = Array.isArray(d.notices) ? d.notices : [];
  tasks   = Array.isArray(d.tasks)   ? d.tasks   : [];
  currentStudent = d.student ? { id: d.student.num, name: d.student.name } : null;
  return d;
}

/* 불러오기 실패를 조용히 넘기지 않고 화면에 알린다(가짜 데이터로 대체하지 않음). */
function showConnError(){
  const nl = document.getElementById('noticeList');
  if(nl) nl.innerHTML = '<div class="empty-state">⚠️ 안내를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.</div>';
  const tl = document.getElementById('taskList');
  if(tl) tl.innerHTML = '<div class="empty-state">⚠️ 할 일을 불러오지 못했어요. 새로고침 해주세요.</div>';
}

async function submitCode(){
  const input = document.getElementById('codeInput');
  const msg = document.getElementById('identityMsg');
  const raw = input ? input.value.trim() : '';
  if(!raw){ if(msg) msg.textContent = '코드를 입력해주세요.'; return; }
  const code = normalizeCode(raw);
  if(msg) msg.textContent = '확인 중…';
  try{
    await loadData(code);
  }catch(e){
    if(msg) msg.textContent = '연결에 실패했어요. 잠시 후 다시 시도해주세요.';
    return;
  }
  if(!currentStudent){
    if(msg) msg.textContent = '코드가 올바르지 않아요. 다시 확인해주세요.';
    renderAll();  // 전체 안내는 그대로 보여줌
    return;
  }
  localStorage.setItem(MYCODE_KEY, code);
  renderIdentityBox();
  renderAll();
}

async function logoutIdentity(){
  currentStudent = null;
  localStorage.removeItem(MYCODE_KEY);
  try{ await loadData(''); renderIdentityBox(); renderAll(); }
  catch(e){ renderIdentityBox(); showConnError(); }
}

function renderIdentityBox(){
  const box = document.getElementById('identityBox');
  if(currentStudent){
    box.innerHTML = `
      <div class="identity-chip">
        <span>🔓 <b>${escapeHtml(currentStudent.name)}</b> 학생 개인 안내 확인 중</span>
        <button onclick="logoutIdentity()">전환</button>
      </div>
    `;
  } else {
    box.innerHTML = `
      <div class="identity-row">
        <input type="text" id="codeInput" placeholder="번호+휴대폰 뒤 4자리 (예: 019596)" maxlength="6" inputmode="numeric"
          onkeydown="if(event.key==='Enter') submitCode()">
        <button onclick="submitCode()">확인</button>
      </div>
      <div class="identity-hint" style="font-size:12px;opacity:.7;margin-top:4px">내 반 번호(2자리) + 내 휴대폰 뒤 4자리 = 6자리 코드예요. 예) 1번이고 폰 뒤가 9596이면 <b>019596</b></div>
      <div class="identity-msg" id="identityMsg"></div>
    `;
  }
}

function renderAll(){
  selectedDate = null;
  const detail = document.getElementById('dayDetail');
  if(detail) detail.style.display = 'none';
  renderNotices();
  renderCalendar();
  renderTasks();
}

/* ===================== 공지사항 ===================== */
function noticesForStudent(){
  return notices
    .filter(n => n.audience==='all' || (currentStudent && n.audience===currentStudent.id));
}

function pastNotices(){
  return ClassNoticeLogic.splitNotices(noticesForStudent(), todayStr()).past;
}
function currentNotices(){
  return ClassNoticeLogic.splitNotices(noticesForStudent(), todayStr()).current;
}

/* 학생이 안내를 확인했는지(읽음) 여부 - 이 브라우저에만 저장됨 */
const READ_KEY = 'classNoticeApp_readNotices';
function loadReadMap(){
  try{ return JSON.parse(localStorage.getItem(READ_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveReadMap(map){
  localStorage.setItem(READ_KEY, JSON.stringify(map));
}
function isNoticeRead(studentId, noticeId){
  const map = loadReadMap();
  return !!(map[studentId] && map[studentId][noticeId]);
}
function toggleNoticeRead(studentId, noticeId){
  const map = loadReadMap();
  if(!map[studentId]) map[studentId] = {};
  const newState = !map[studentId][noticeId];
  map[studentId][noticeId] = newState;
  saveReadMap(map);
  renderNotices();
  if(archiveOpen){
    const archiveEl = document.getElementById('archiveList');
    archiveEl.innerHTML = pastNotices().map(n => noticeCardHtml(n, {archived:true})).join('');
  }

  const student = currentStudent;
  const notice = notices.find(n => n.id === noticeId);
  if(student && notice){
    submitResponse('공지', notice.id, newState ? '확인' : '확인취소');
  }
}

function fileButtonHtml(n){
  const url = safeUrl(n.fileUrl);
  if(!url) return '';
  const label = n.fileName || '첨부파일';
  return `<a class="file-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener">📎 ${escapeHtml(label)} 보기</a>`;
}

function noticeCardHtml(n, opts){
  opts = opts || {};
  const identified = !!currentStudent;
  const read = identified && isNoticeRead(currentStudent.id, n.id);
  const unread = identified && !read;
  const checkboxHtml = identified
    ? `<input type="checkbox" class="notice-checkbox" ${read?'checked':''} onchange='toggleNoticeRead(${JSON.stringify(currentStudent.id)}, ${JSON.stringify(n.id)})'>`
    : `<span class="checkbox-placeholder" title="개인 코드 입력 후 확인 체크 가능">✓</span>`;
  const endDate = ClassNoticeLogic.noticeEndDate(n);
  const dateText = endDate && endDate !== n.date
    ? `안내 ${n.date} · ${endDate}까지`
    : `안내 ${n.date}`;
  return `
    <div class="notice-card ${n.urgent?'urgent':''} ${opts.archived?'archived':''} ${read?'done':''}">
      ${checkboxHtml}
      <div class="notice-body">
        <div class="ntitle">
          ${unread?'<span class="unread-dot"></span>':''}
          ${escapeHtml(n.title)}
          <span class="tag ${n.audience==='all'?'all':'personal'}">${n.audience==='all'?'전체':'개인'}</span>
          ${n.urgent?'<span class="tag urgent">중요</span>':''}
          ${unread?'<span class="tag new">안읽음</span>':''}
        </div>
        ${n.content ? `<div class="ncontent">${escapeHtml(n.content)}</div>` : ''}
        ${fileButtonHtml(n)}
        <div class="ndate">${escapeHtml(dateText)}</div>
      </div>
    </div>
  `;
}

function renderNotices(){
  const current = currentNotices();
  const identified = !!currentStudent;
  const unreadCount = identified ? current.filter(n => !isNoticeRead(currentStudent.id, n.id)).length : 0;
  const badge = document.getElementById('noticeCount');
  badge.textContent = unreadCount>0 ? `안읽음 ${unreadCount}` : `${current.length}`;
  badge.className = 'badge' + (unreadCount>0 ? ' unread' : '');

  const el = document.getElementById('noticeList');
  el.innerHTML = current.length
    ? current.map(n => noticeCardHtml(n)).join('')
    : '<div class="empty-state">현재 확인할 안내사항이 없어요</div>';

  const past = pastNotices();
  const toggleBtn = document.getElementById('archiveToggle');
  toggleBtn.textContent = `지난 공지 보기 (${past.length})`;
  toggleBtn.style.display = past.length===0 ? 'none' : 'block';
  if(archiveOpen){
    const archiveEl = document.getElementById('archiveList');
    archiveEl.innerHTML = past.map(n => noticeCardHtml(n, {archived:true})).join('');
  }
}

let archiveOpen = false;
function toggleArchive(){
  archiveOpen = !archiveOpen;
  const archiveEl = document.getElementById('archiveList');
  const toggleBtn = document.getElementById('archiveToggle');
  if(archiveOpen){
    const past = pastNotices();
    archiveEl.innerHTML = past.map(n => noticeCardHtml(n, {archived:true})).join('');
    archiveEl.style.display = 'block';
    toggleBtn.textContent = '지난 공지 숨기기';
  } else {
    archiveEl.style.display = 'none';
    toggleBtn.textContent = `지난 공지 보기 (${pastNotices().length})`;
  }
}

/* ===================== 제출 / 할 일 ===================== */
function tasksForStudent(){
  return tasks
    .filter(t => t.audience==='all' || (currentStudent && t.audience===currentStudent.id))
    .sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
}

function taskStatus(dueDate){
  const today = todayStr();
  const diffDays = Math.ceil((new Date(dueDate) - new Date(today)) / 86400000);
  if(diffDays < 0) return {cls:'closed', label:'마감됨'};
  if(diffDays <= 1) return {cls:'soon', label: diffDays===0 ? '오늘 마감' : 'D-1'};
  if(diffDays <= 3) return {cls:'soon', label:`D-${diffDays}`};
  return {cls:'ongoing', label:`D-${diffDays}`};
}

/* 학생이 직접 체크한 완료 여부 - 이 브라우저에만 저장됨 */
const DONE_KEY = 'classNoticeApp_taskDone';
function loadDoneMap(){
  try{ return JSON.parse(localStorage.getItem(DONE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveDoneMap(map){
  localStorage.setItem(DONE_KEY, JSON.stringify(map));
}
function isTaskDone(studentId, taskId){
  const map = loadDoneMap();
  return !!(map[studentId] && map[studentId][taskId]);
}
function toggleTaskDone(studentId, taskId){
  const map = loadDoneMap();
  if(!map[studentId]) map[studentId] = {};
  const newState = !map[studentId][taskId];
  map[studentId][taskId] = newState;
  saveDoneMap(map);
  renderTasks();

  const student = currentStudent;
  const task = tasks.find(t => t.id === taskId);
  if(student && task){
    submitResponse('할일', task.id, newState ? '완료' : '취소');
  }
}

/* 확인/완료 응답은 같은 Apps Script의 앱_학생응답 시트에 기록한다. */
function submitResponse(itemType, itemId, response){
  const code = localStorage.getItem(MYCODE_KEY) || '';
  if(!code) return;
  fetch(SHEET_API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'recordResponse', code, itemType, itemId, response})
  }).catch(()=>{});
}

function renderTasks(){
  const list = tasksForStudent();
  const identified = !!currentStudent;
  const sub = document.getElementById('taskSub');
  sub.textContent = identified
    ? '체크하면 선생님 기록에도 자동으로 남아요. 단, 화면 표시(체크 상태)는 이 기기에서만 유지돼요.'
    : '개인 코드를 입력하면 직접 체크할 수 있어요.';

  const el = document.getElementById('taskList');
  if(list.length===0){
    el.innerHTML = `<div class="empty-state">등록된 할 일이 없어요</div>`;
    return;
  }
  el.innerHTML = list.map(t=>{
    const done = identified && isTaskDone(currentStudent.id, t.id);
    const st = taskStatus(t.dueDate);
    const overdueNotDone = !done && st.cls === 'closed';
    const pillClass = done ? 'done' : (overdueNotDone ? 'overdue' : st.cls);
    const pillLabel = done ? '완료' : (overdueNotDone ? '🚨 마감(미제출)' : st.label);
    const checkboxHtml = identified
      ? `<input type="checkbox" class="task-checkbox" ${done?'checked':''} onchange='toggleTaskDone(${JSON.stringify(currentStudent.id)}, ${JSON.stringify(t.id)})'>`
      : `<span class="checkbox-placeholder" title="개인 코드 입력 후 체크 가능">✓</span>`;
    return `
      <div class="task-item ${done?'done':''} ${overdueNotDone?'overdue':''}">
        ${checkboxHtml}
        <div class="task-info">
          <div class="task-title">${overdueNotDone?'🚨 ':''}${escapeHtml(t.title)}</div>
          <div class="task-due">제출기한 ${escapeHtml(t.dueDate)}</div>
        </div>
        <div class="status-pill ${pillClass}">${pillLabel}</div>
      </div>
    `;
  }).join('');
}

/* ===================== 달력 ===================== */
function holidayTitle(dateStr){
  if(typeof holidays === 'undefined') return null;
  const h = holidays.find(x => x.date === dateStr);
  return h ? h.title : null;
}

function dowOf(dateStr){
  return new Date(dateStr + 'T00:00:00').getDay();
}

function specialRangeFor(dateStr){
  if(typeof specialRanges === 'undefined') return null;
  const r = specialRanges.find(r => dateStr >= r.start && dateStr <= r.end);
  if(!r) return null;
  if(r.type === 'exam'){
    const dow = dowOf(dateStr);
    if(dow === 0 || dow === 6) return null; // 고사기간은 주말 제외
  }
  return r;
}

function vacationRangeFor(dateStr){
  if(typeof vacationRanges === 'undefined') return null;
  return vacationRanges.find(r => dateStr >= r.start && dateStr <= r.end) || null;
}

// 실제로 회색 처리해야 하는지 여부 (weekdayOnly면 주말/공휴일은 회색 제외)
function isGreyedOut(dateStr){
  const v = vacationRangeFor(dateStr);
  if(!v) return false;
  if(v.weekdayOnly){
    const dow = dowOf(dateStr);
    if(dow === 0 || dow === 6) return false;
    if(holidayTitle(dateStr)) return false;
  }
  return true;
}

function eventDatesForStudent(){
  const dates = new Set();
  tasksForStudent().forEach(t=>dates.add(t.dueDate));
  noticesForStudent().forEach(n=>dates.add(n.date));
  if(typeof calendarEvents !== 'undefined'){
    calendarEvents.forEach(e=>dates.add(e.date));
  }
  if(typeof holidays !== 'undefined'){
    holidays.forEach(h=>dates.add(h.date));
  }
  if(typeof specialRanges !== 'undefined'){
    specialRanges.forEach(r=>{
      let d = r.start;
      while(d <= r.end){
        const dow = dowOf(d);
        const skipWeekend = r.type === 'exam' && (dow === 0 || dow === 6);
        if(!skipWeekend) dates.add(d);
        d = fmtDate(new Date(new Date(d).getTime() + 86400000));
      }
    });
  }
  // 회색(방학/정리기간) 처리되는 날짜는 일정 표시에서 제외
  [...dates].forEach(d=>{ if(isGreyedOut(d)) dates.delete(d); });
  return dates;
}

let selectedDate = null;
function showDayDetail(dateStr){
  if(isGreyedOut(dateStr)) return;
  selectedDate = dateStr;
  renderCalendar();

  const items = [];
  const holiday = holidayTitle(dateStr);
  if(holiday) items.push(`🔴 [공휴일] ${holiday}`);
  const range = specialRangeFor(dateStr);
  if(range) items.push(`🏫 ${range.title}`);
  if(typeof calendarEvents !== 'undefined'){
    calendarEvents.filter(e=>e.date===dateStr).forEach(e=>items.push(`🏫 ${e.title}`));
  }
  noticesForStudent().filter(n=>n.date===dateStr).forEach(n=>items.push(`📢 [안내] ${n.title}`));
  tasksForStudent().filter(t=>t.dueDate===dateStr).forEach(t=>items.push(`📌 [할 일] ${t.title}`));

  const detail = document.getElementById('dayDetail');
  const title = document.getElementById('dayDetailTitle');
  const list = document.getElementById('dayDetailList');
  const d = new Date(dateStr);
  title.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 일정`;
  list.innerHTML = items.length
    ? items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')
    : '<li>등록된 일정이 없어요</li>';
  detail.style.display = 'block';
}

function changeMonth(diff){
  calDate.setMonth(calDate.getMonth()+diff);
  selectedDate = null;
  document.getElementById('dayDetail').style.display = 'none';
  renderCalendar();
}

function goToToday(){
  calDate = new Date();
  const t = todayStr();
  if(isGreyedOut(t)){
    selectedDate = null;
    document.getElementById('dayDetail').style.display = 'none';
    renderCalendar();
  } else {
    showDayDetail(t);
  }
}

function openMonthJump(){
  const input = document.getElementById('monthJumpInput');
  const label = document.getElementById('calYm');
  const y = calDate.getFullYear(), m = String(calDate.getMonth()+1).padStart(2,'0');
  input.value = `${y}-${m}`;
  label.style.display = 'none';
  input.style.display = 'inline-block';
  input.focus();
  if(input.showPicker){ try{ input.showPicker(); }catch(e){} }
}

function hideMonthJump(){
  document.getElementById('monthJumpInput').style.display = 'none';
  document.getElementById('calYm').style.display = 'block';
}

function jumpToMonth(value){
  if(!value) { hideMonthJump(); return; }
  const [y,m] = value.split('-').map(Number);
  calDate = new Date(y, m-1, 1);
  selectedDate = null;
  document.getElementById('dayDetail').style.display = 'none';
  hideMonthJump();
  renderCalendar();
}

function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calYm').textContent = `${y}년 ${m+1}월`;

  const dows = ['일','월','화','수','목','금','토'];
  const firstDay = new Date(y,m,1).getDay();
  const lastDate = new Date(y,m+1,0).getDate();
  const eventDates = eventDatesForStudent();
  const today = todayStr();

  let html = dows.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++){ html += `<div class="cal-day empty"></div>`; }
  for(let d=1; d<=lastDate; d++){
    const dateStr = fmtDate(new Date(y,m,d));
    const dow = new Date(y,m,d).getDay();
    const isToday = dateStr===today;
    const isSelected = dateStr===selectedDate;
    const holidayObj = (typeof holidays !== 'undefined') ? holidays.find(h=>h.date===dateStr) : null;
    const greyedOut = isGreyedOut(dateStr);
    const range = specialRangeFor(dateStr);
    const hasEvent = !greyedOut && eventDates.has(dateStr);
    const alwaysEvent = (!greyedOut && typeof calendarEvents !== 'undefined')
      ? calendarEvents.find(e => e.date===dateStr && e.alwaysShow)
      : null;
    const shortLabel = greyedOut ? '' : (holidayObj ? (holidayObj.short || holidayObj.title) : (alwaysEvent ? (alwaysEvent.short || alwaysEvent.title) : ''));

    let classes = ['cal-day'];
    if(isToday) classes.push('today');
    if(isSelected) classes.push('selected');
    if(shortLabel) classes.push('has-label');
    if(greyedOut){
      classes.push('range-vacation');
    } else {
      if(dow===0) classes.push('sunday');
      if(dow===6) classes.push('saturday');
      if(holidayObj) classes.push('holiday');
      if(holidayObj) classes.push('range-holiday');
      else if(range && range.type==='exam') classes.push('range-exam');
      else if(range && range.type==='prep') classes.push('range-prep');
      else if(hasEvent) classes.push('has-event');
    }

    const clickAttr = (hasEvent && !greyedOut) ? `onclick="showDayDetail('${dateStr}')"` : '';
    const dot = (hasEvent && !isToday && !greyedOut && !shortLabel) ? '<span class="dot"></span>' : '';
    const labelHtml = shortLabel ? `<span class="day-label">${shortLabel}</span>` : '';
    html += `<div class="${classes.join(' ')}" ${clickAttr}>${d}${labelHtml}${dot}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

/* ===================== 시작 ===================== */
async function init(){
  const now = new Date();
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 기준 안내`;
  renderCalendar();      // 달력은 정적 data.js라 항상 표시
  renderIdentityBox();   // 로그인 입력창을 즉시 표시(네트워크 대기 전)
  const savedCode = localStorage.getItem(MYCODE_KEY) || '';
  try{
    await loadData(savedCode);
    renderIdentityBox();
    renderNotices();
    renderTasks();
  }catch(e){
    currentStudent = null;
    renderIdentityBox();
    showConnError();
  }
}
init();
