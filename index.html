<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학년 3반 학급 안내사항</title>
<style>
  :root{
    --primary:#4361ee;
    --primary-light:#eef1ff;
    --danger:#e63946;
    --warning:#f4a261;
    --success:#2a9d8f;
    --gray-bg:#f6f7fb;
    --border:#e5e7f0;
    --text:#222639;
    --text-sub:#7a7f95;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--gray-bg);
    color:var(--text);
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:#fff;
    box-shadow:0 0 24px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:#fff;
    z-index:10;
  }
  header .title-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .app-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    object-position:center center;
    flex-shrink:0;
    border:2px solid var(--primary-light);
  }
  header .title{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  header .sub{
    font-size:13px;
    color:var(--text-sub);
    margin-top:2px;
  }

  section{padding:18px 20px;}
  section + section{border-top:8px solid var(--gray-bg);}

  /* 2단 배치: 좁은 화면은 지금처럼 한 줄로 쌓이고,
     넓은 화면에서만 왼쪽=공지, 오른쪽=고사 시간표·학급 시간표·학사일정으로 나뉜다. */
  .content-grid{display:flex;flex-direction:column;}
  .main-column,.side-column{display:flex;flex-direction:column;min-width:0;}
  .side-column{border-top:8px solid var(--gray-bg);}
  .main-column > section:first-child{border-top:none;}
  @media (min-width:940px){
    .app{max-width:1080px;}
    .content-grid{
      display:grid;
      grid-template-columns:minmax(0,1.4fr) minmax(380px,1fr);
      align-items:start;
    }
    .side-column{
      border-top:none;
      border-left:8px solid var(--gray-bg);
      /* 화면을 내려도 시간표·달력·학습링크가 따라온다.
         내용이 화면보다 길면 이 칸 안에서만 스크롤된다. */
      position:sticky;
      top:var(--header-h,76px);          /* 고정 헤더 아래에 붙인다 */
      align-self:start;
      max-height:calc(100vh - var(--header-h,76px));
      overflow-y:auto;
      overscroll-behavior:contain;
    }
    .side-column::-webkit-scrollbar{width:8px;}
    .side-column::-webkit-scrollbar-thumb{background:var(--gray-bg);border-radius:8px;}
    .side-column > section:first-child{border-top:none;}

  }
  /* 학습링크: 학생이 바로 들어갈 수 있는 학습 앱 모음 */
  .link-list{display:flex;flex-direction:column;gap:8px;}
  .link-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    text-decoration:none;
    color:inherit;
    background:#fff;
  }
  .link-card:hover{border-color:var(--primary);background:var(--gray-bg);}
  .link-card .link-emoji{font-size:20px;line-height:1;}
  .link-card .link-text{min-width:0;}
  .link-card .link-name{display:block;font-size:14px;font-weight:700;}
  .link-card .link-desc{display:block;font-size:12px;color:var(--text-sub);margin-top:2px;}
  .link-card .link-arrow{margin-left:auto;color:var(--text-sub);font-size:14px;}

  .section-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .section-title .badge{
    font-size:11px;
    background:var(--primary-light);
    color:var(--primary);
    padding:2px 7px;
    border-radius:10px;
    font-weight:600;
  }
  .section-title .badge.unread{
    background:#ffe3e5;
    color:var(--danger);
  }

  /* 개인 코드 확인 영역 */
  .identity-box{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    background:var(--gray-bg);
  }
  .identity-box .id-label{
    font-size:12.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .identity-row{display:flex; gap:8px;}
  .identity-row input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    letter-spacing:2px;
  }
  .identity-row button{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .identity-msg{
    font-size:11.5px;
    color:var(--danger);
    margin-top:6px;
    min-height:14px;
  }
  .identity-chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
  }
  .identity-chip b{color:var(--primary);}
  .identity-chip button{
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* 오늘의 안내 */
  .notice-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
    position:relative;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .notice-card.urgent{border-color:#ffd2d6;background:#fff7f7;}
  .notice-card.done .ntitle{color:var(--text-sub);}
  .notice-checkbox{
    width:20px;
    height:20px;
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    accent-color:var(--primary);
  }
  .checkbox-placeholder{
    width:20px;
    height:20px;
    flex-shrink:0;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-sub);
    font-size:11px;
    border:1px dashed var(--border);
    border-radius:5px;
    cursor:not-allowed;
  }
  .notice-body{flex:1; min-width:0;}
  .notice-card .ntitle{
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .notice-card .ntitle .tag{
    font-size:10px;
    padding:2px 6px;
    border-radius:6px;
    font-weight:700;
  }
  .tag.all{background:#e8eefc;color:var(--primary);}
  .tag.personal{background:#fff1e6;color:var(--warning);}
  .tag.urgent{background:#ffe3e5;color:var(--danger);}
  .notice-card .ncontent{
    font-size:13px;
    color:#4a4e63;
    line-height:1.5;
  }
  .notice-text + .notice-table-wrap,.notice-table-wrap + .notice-text{margin-top:9px;}
  .notice-table-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:#fff;}
  .notice-table{width:100%;min-width:360px;border-collapse:collapse;font-size:12px;white-space:nowrap;}
  .notice-table th,.notice-table td{padding:7px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;}
  .notice-table th{background:var(--primary-light);color:var(--primary);font-weight:700;}
  .notice-table th:last-child,.notice-table td:last-child{border-right:0;}
  .notice-table tbody tr:last-child td{border-bottom:0;}
  .notice-card .ndate{
    font-size:11px;
    color:var(--text-sub);
    margin-top:6px;
  }
  .notice-card .unread-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--danger);
    display:inline-block;
    flex-shrink:0;
  }
  .tag.new{background:#ffe3e5;color:var(--danger);}

  /* 오늘의 안내: 날짜 이동 */
  .notice-datenav{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:12px;
  }
  .notice-datenav button.nd-arrow{
    border:none;
    background:var(--gray-bg);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .notice-datenav .nd-label{
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
    flex:1;
    text-align:center;
    white-space:nowrap;
  }
  .notice-datenav .nd-label:hover{background:var(--gray-bg);}
  .notice-datenav .nd-label .nd-badge{
    font-size:11px;
    font-weight:700;
    color:var(--primary);
    margin-left:5px;
  }
  .notice-datenav .nd-input{
    font-size:13px;
    font-weight:700;
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px 6px;
    color:var(--text);
    flex:1;
  }

  .notice-subheader{
    font-size:11.5px;
    font-weight:700;
    color:var(--text-sub);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }

  .archive-toggle{
    width:100%;
    text-align:center;
    padding:10px;
    margin-top:4px;
    background:var(--gray-bg);
    border:1px dashed var(--border);
    border-radius:10px;
    font-size:12.5px;
    color:var(--text-sub);
    cursor:pointer;
  }
  .archive-toggle:hover{background:#eceefa;}
  #archiveList{margin-top:10px;display:none;}
  .notice-card.archived{opacity:0.75;}

  /* 학급 시간표(달력 위 고정) — 가로 스크롤 없이 한눈에 */
  #timetableSection .tt-intro{font-size:12px;color:var(--text-sub);margin:-4px 0 10px;}
  #classTimetable .notice-text{font-size:11.5px;color:#4a4e63;line-height:1.5;}
  #classTimetable .notice-text + .notice-table-wrap{margin-top:0;}
  #classTimetable .notice-table-wrap{overflow-x:visible;border:1px solid var(--border);border-radius:9px;}
  #classTimetable .notice-table{width:100%;min-width:0;table-layout:fixed;font-size:10.5px;white-space:normal;}
  #classTimetable .notice-table th,#classTimetable .notice-table td{padding:5px 2px;word-break:keep-all;line-height:1.2;}
  #classTimetable .notice-table th:first-child,#classTimetable .notice-table td:first-child{width:24px;color:var(--text-sub);}
  #classTimetable .notice-table td{color:var(--text);}

  /* 고사 시간표(학급 시간표 위) — 날짜를 열로 두어 한눈에 */
  #examSection .exam-intro{font-size:12px;color:var(--text-sub);margin:-4px 0 10px;}
  .exam-table-wrap{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;}
  .exam-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px;}
  .exam-table th,.exam-table td{padding:7px 3px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;word-break:keep-all;line-height:1.3;}
  .exam-table th{background:var(--primary-light);color:var(--primary);font-weight:700;}
  .exam-table th .wd{display:block;font-size:10px;font-weight:600;opacity:.75;}
  .exam-table th:first-child,.exam-table td:first-child{width:50px;}
  .exam-table th:last-child,.exam-table td:last-child{border-right:0;}
  .exam-table tbody tr:last-child td{border-bottom:0;}
  .exam-table td{color:var(--text);font-weight:600;}
  .exam-table td.time{font-size:10px;color:var(--text-sub);font-weight:500;line-height:1.25;}
  .exam-table td.time b{display:block;color:var(--text);font-size:11px;}
  .exam-table td.none{color:#c3c6d4;font-weight:400;}
  .exam-table th.today{background:var(--primary);color:#fff;}
  .exam-table td.today{background:#fff8e1;}

  /* 달력 */
  .calendar{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:8px;
  }
  .cal-nav{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cal-header button{
    border:none;
    background:var(--gray-bg);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .today-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:11.5px;
    font-weight:700;
    width:auto !important;
    padding:0 10px;
    height:28px;
    border-radius:8px;
    cursor:pointer;
    flex-shrink:0;
  }
  .cal-header .ym{font-size:14px;font-weight:700;cursor:pointer;}
  .month-jump-input{
    font-size:14px;
    font-weight:700;
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px 6px;
    color:var(--text);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    text-align:center;
  }
  .cal-grid .dow{
    font-size:11px;
    color:var(--text-sub);
    padding-bottom:4px;
  }
  .cal-day{
    position:relative;
    min-height:38px;
    height:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    border-radius:8px;
    cursor:default;
    color:var(--text);
    padding:3px 1px;
  }
  .cal-day.has-label{
    flex-direction:column;
    gap:1px;
  }
  .cal-day .day-label{
    font-size:7px;
    line-height:1.1;
    font-weight:700;
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{background:var(--primary);color:#fff;font-weight:700;}
  .cal-day .dot{
    position:absolute;
    bottom:4px;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--danger);
  }
  .cal-day.has-event:not(.today){background:var(--primary-light);}
  .cal-day.has-event{cursor:pointer;}
  .cal-day.selected{outline:2px solid var(--primary);}

  .cal-day.sunday{color:var(--danger);}
  .cal-day.saturday{color:#2b6cb0;}
  .cal-day.holiday{color:var(--danger); font-weight:700;}
  .cal-day.range-holiday:not(.today){background:#ffe3e5;}
  .cal-day.range-exam:not(.today){background:#fff3b0;}
  .cal-day.range-prep:not(.today){background:#e3f2fd;}
  .cal-day.range-vacation{background:#eceef2; color:#b4b8c4; cursor:default;}
  .cal-day.today{background:var(--primary) !important; color:#fff !important; font-weight:700;}

  .day-detail{
    margin-top:12px;
    padding:12px 14px;
    background:var(--gray-bg);
    border-radius:10px;
    display:none;
  }
  .day-detail .dd-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
  }
  .day-detail ul{
    margin:0;
    padding-left:18px;
    font-size:12.5px;
    color:#4a4e63;
    line-height:1.6;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    margin-top:10px;
    font-size:10.5px;
    color:var(--text-sub);
  }
  .legend span{display:flex;align-items:center;gap:4px;}
  .legend i{width:9px;height:9px;border-radius:3px;background:var(--danger);display:inline-block;}
  .legend i.holiday{background:#ffe3e5;border:1px solid #ffc2c8;}
  .legend i.exam{background:#fff3b0;border:1px solid #f0dc7a;}
  .legend i.prep{background:#e3f2fd;border:1px solid #bfe0fa;}
  .legend i.vacation{background:#eceef2;border:1px solid #d8dae0;}
  .legend i.sat,.legend i.sun{
    width:auto;height:auto;border-radius:0;background:none;border:none;
    font-weight:700;font-style:normal;font-size:11px;
  }
  .legend i.sat{color:#2b6cb0;}
  .legend i.sun{color:var(--danger);}

  .section-sub{
    font-size:11.5px;
    color:var(--text-sub);
    margin:-6px 0 12px;
  }

  .cal-note{font-size:12px;color:var(--text-sub);margin:-4px 0 8px;}
  .identity-hint{font-size:12px;opacity:.7;margin-top:4px;}

  .empty-state{
    text-align:center;
    color:var(--text-sub);
    font-size:13px;
    padding:20px 0;
  }
  footer{
    padding:16px 20px 24px;
    text-align:center;
    font-size:11px;
    color:var(--text-sub);
  }
  /* 글씨 크기 확대는 기본 규칙보다 뒤에 와야 이긴다(같은 특이도는 나중 규칙 우선). */
  @media (min-width:940px){
  /* 교실 TV·빔프로젝터로 띄우는 화면이라 뒷자리에서도 읽히게 글씨를 키운다.
     모바일(940px 미만)은 손에 들고 보므로 기존 크기 그대로 둔다. */
  header .title{font-size:27px;}
  header .sub{font-size:17px;}
  header .app-icon{width:64px;height:64px;}

  .section-title{font-size:22px;}
  .section-title .badge{font-size:15px;}
  .section-sub{font-size:15px;}
  .empty-state{font-size:18px;}
  .archive-toggle{font-size:16px;padding:14px;}

  .notice-card .ntitle{font-size:21px;}
  .notice-card .ntitle .tag{font-size:13px;padding:3px 8px;}
  .notice-card .ncontent{font-size:19px;}
  .notice-card .ndate{font-size:15px;}
  .notice-table{font-size:16px;}

  #examSection .exam-intro,#timetableSection .tt-intro{font-size:15px;}
  .exam-table{font-size:15.5px;}
  .exam-table th .wd{font-size:13px;}
  .exam-table td.time{font-size:13px;}
  .exam-table td.time b{font-size:14px;}
  #classTimetable .notice-table{font-size:14.5px;}
  #classTimetable .notice-text{font-size:15px;}

  .cal-note{font-size:15px;}
  .cal-header .ym{font-size:19px;}
  .today-btn{font-size:15px;height:34px;}
  .cal-header button{width:34px;height:34px;font-size:18px;}
  .cal-grid .dow{font-size:14px;}
  .cal-day{font-size:17px;min-height:48px;}
  .cal-day .day-label{font-size:10px;}
  .legend{font-size:13.5px;}
  .legend i.sat,.legend i.sun{font-size:14px;}
  .day-detail .dd-title{font-size:17px;}
  .day-detail ul{font-size:16px;}

  .identity-hint{font-size:15px;}
  footer{font-size:14px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-row">
      <img class="app-icon" src="snack_icon_full.png" alt="">
      <div class="title">2학년 3반 학급 안내사항:D</div>
    </div>
    <div class="sub" id="headerDate">-</div>
  </header>

  <div class="content-grid">
   <div class="main-column">

  <section>
    <div class="section-title">📢 학급 안내사항 <span class="badge" id="noticeCount">0</span></div>
    <div class="section-sub">종료일까지 한곳에 표시되고, 다음 날 지난 공지로 자동 이동합니다.</div>
    <div id="noticeList"></div>
    <button class="archive-toggle" id="archiveToggle" onclick="toggleArchive()">지난 공지 보기</button>
    <div id="archiveList"></div>
  </section>

  <section>
    <div class="section-title">🔑 내 개인 공지 확인하기</div>
    <div class="identity-box" id="identityBox"></div>
  </section>

   </div><!-- /main-column -->

   <aside class="side-column">

  <section id="examSection" style="display:none">
    <div class="section-title" id="examTitle">📝 고사 시간표</div>
    <div class="exam-intro" id="examIntro"></div>
    <div id="examSchedule"></div>
  </section>

  <section id="timetableSection" style="display:none">
    <div class="section-title">🗓️ 2학기 학급 시간표</div>

<script>
let currentStudent = null;
let calDate = new Date();

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function todayStr(){ return fmtDate(new Date()); }
function shiftDateStr(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return fmtDate(d);
}
function labelDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;
}

/* ===================== 개인 코드 확인 ===================== */
const MYCODE_KEY = 'classNoticeApp_myCode';
/* 구글시트 문지기(Apps Script) 웹앱 엔드포인트. 개인정보(이름·코드·명단)는 여기서 안 나옴. */
const SHEET_API = window.CLASS_NOTICE_CONFIG.apiUrl;

/* 공지/할일은 서버에서 받아온다(정적 data.js가 아님). */
let notices = [];

/* 개인 코드는 반드시 두 자리 번호 + 휴대폰 뒤 4자리의 정확한 6자리다. */
function normalizeCode(raw){
  return ClassNoticeStudentCode.normalize(raw);
}

/* 서버(구글시트 문지기)에서 공지/할일을 가져온다.
   code가 있으면 전체+본인 것, 없거나 틀리면 전체만. 대상 필터는 서버가 처리. */
async function loadData(code){
  const url = SHEET_API + (code ? ('?code=' + encodeURIComponent(code)) : '');
  const r = await fetch(url);
  if(!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
  const d = await r.json();
  if(!d || !d.ok) throw new Error('데이터 형식 오류');
  notices = Array.isArray(d.notices) ? d.notices : [];
  currentStudent = d.student ? { id: d.student.num, name: d.student.name } : null;
  return d;
}

/* 불러오기 실패를 조용히 넘기지 않고 화면에 알린다(가짜 데이터로 대체하지 않음). */
function showConnError(){
  const nl = document.getElementById('noticeList');
  if(nl) nl.innerHTML = '<div class="empty-state">⚠️ 안내를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.</div>';
}

async function submitCode(){
  const input = document.getElementById('codeInput');
  const msg = document.getElementById('identityMsg');
  const raw = input ? input.value.trim() : '';
  if(!raw){ if(msg) msg.textContent = '코드를 입력해주세요.'; return; }
  const code = normalizeCode(raw);
  if(!code){ if(msg) msg.textContent = '학번 뒤 2자리와 휴대폰 뒤 4자리를 합친 숫자 6자리를 입력해주세요.'; return; }
  if(msg) msg.textContent = '확인 중…';
  try{
    await loadData(code);
  }catch(e){
    if(msg) msg.textContent = '연결에 실패했어요. 잠시 후 다시 시도해주세요.';
    return;
  }
  if(!currentStudent){
    if(msg) msg.textContent = '코드가 올바르지 않아요. 다시 확인해주세요.';
    renderAll();  // 전체 안내는 그대로 보여줌
    return;
  }
  localStorage.setItem(MYCODE_KEY, code);
  renderIdentityBox();
  renderAll();
}

async function logoutIdentity(){
  currentStudent = null;
  localStorage.removeItem(MYCODE_KEY);
  try{ await loadData(''); renderIdentityBox(); renderAll(); }
  catch(e){ renderIdentityBox(); showConnError(); }
}

function renderIdentityBox(){
  const box = document.getElementById('identityBox');
  if(currentStudent){
    box.innerHTML = `
      <div class="identity-chip">
        <span>🔓 <b>${escapeHtml(currentStudent.name)}</b> 학생 개인 안내 확인 중</span>
        <button onclick="logoutIdentity()">전환</button>
      </div>
    `;
  } else {
    box.innerHTML = `
      <div class="identity-row">
        <input type="text" id="codeInput" placeholder="학번 뒤 2자리+휴대폰 뒤 4자리 (예: 261234)" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
          onkeydown="if(event.key==='Enter') submitCode()">
        <button onclick="submitCode()">확인</button>
      </div>
      <div class="identity-hint"><b>학번 뒤 두 자리</b>에 휴대폰 뒤 4자리를 붙인 6자리 코드예요. 예) 학번 20326, 휴대폰 뒤 1234이면 <b>261234</b> (출석 순번이 아니라 학번이에요)</div>
      <div class="identity-msg" id="identityMsg"></div>
    `;
  }
}

function renderAll(){
  selectedDate = null;
  const detail = document.getElementById('dayDetail');
  if(detail) detail.style.display = 'none';
  renderClassTimetable();
  renderNotices();
  renderCalendar();
}

/* ===================== 공지사항 ===================== */
/* 학급 시간표 공지는 일반 목록이 아니라 달력 위 고정 영역에 표시한다. */
function isTimetableNotice(n){
  return n && n.audience==='all' && typeof n.title==='string' && n.title.indexOf('학급 시간표') !== -1;
}
function noticesForStudent(){
  return notices
    .filter(n => !isTimetableNotice(n))
    .filter(n => n.audience==='all' || (currentStudent && n.audience===currentStudent.id));
}

/* 달력 위에 고정 표시되는 학급 시간표 */
function renderClassTimetable(){
  const section = document.getElementById('timetableSection');
  const holder = document.getElementById('classTimetable');
  if(!section || !holder) return;
  const tt = notices.find(isTimetableNotice);
  if(tt && tt.content){
    holder.innerHTML = ClassNoticeContent.render(tt.content);
    section.style.display = 'block';
  } else {
    holder.innerHTML = '';
    section.style.display = 'none';
  }
}

/* 학사일정 달력 아래 학습링크. 목록은 data.js의 studyLinks에서 읽는다.
   외부 앱이라 새 탭으로 열고, 링크에서 이 사이트를 만지지 못하게 막는다. */
function renderStudyLinks(){
  const holder = document.getElementById('studyLinks');
  if(!holder) return;
  const links = (typeof studyLinks !== 'undefined' && Array.isArray(studyLinks)) ? studyLinks : [];
  if(!links.length){
    holder.innerHTML = '<div class="empty-state">아직 등록된 학습링크가 없어요</div>';
    return;
  }
  holder.innerHTML = links.map((link) => `
    <a class="link-card" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
      <span class="link-emoji" aria-hidden="true">${escapeHtml(link.emoji || '🔗')}</span>
      <span class="link-text">
        <span class="link-name">${escapeHtml(link.name || '')}</span>
        ${link.desc ? `<span class="link-desc">${escapeHtml(link.desc)}</span>` : ''}
      </span>
      <span class="link-arrow" aria-hidden="true">›</span>
    </a>`).join('');
}

/* 학급 시간표 위에 표시되는 고사 시간표. data.js의 examSchedules에서 2학년 열만 쓴다.
   시험 마지막 날이 지나면 다음 고사가 입력될 때까지 숨긴다. */
const CLASS_GRADE = 2;
function renderExamSchedule(){
  const section = document.getElementById('examSection');
  const holder = document.getElementById('examSchedule');
  if(!section || !holder) return;
  const list = (typeof examSchedules !== 'undefined' && Array.isArray(examSchedules)) ? examSchedules : [];
  const today = todayStr();
  const exam = list.find(e => e.end >= today);
  if(!exam){
    holder.innerHTML = '';
    section.style.display = 'none';
    return;
  }
  const gi = CLASS_GRADE - 1;
  const WD = ['일','월','화','수','목','금','토'];
  const md = d => `${Number(d.slice(5,7))}월 ${Number(d.slice(8,10))}일(${WD[new Date(d+'T00:00:00').getDay()]})`;
  const head = exam.days.map(d => {
    const cls = d.date === today ? ' class="today"' : '';
    return `<th${cls}>${Number(d.date.slice(5,7))}/${Number(d.date.slice(8,10))}<span class="wd">${WD[new Date(d.date+'T00:00:00').getDay()]}</span></th>`;
  }).join('');
  const rowCount = Math.max(...exam.days.map(d => d.slots.length));
  const rows = [];
  for(let i = 0; i < rowCount; i++){
    const cells = exam.days.map(d => (d.slots[i] && d.slots[i].grades[gi]) || '');
    if(cells.every(c => !c)) continue;
    const ref = exam.days.find(d => d.slots[i]).slots[i];
    const tds = cells.map((c, k) => {
      const cls = [c ? '' : 'none', exam.days[k].date === today ? 'today' : ''].filter(Boolean).join(' ');
      return `<td${cls ? ` class="${cls}"` : ''}>${c ? escapeHtml(c) : '·'}</td>`;
    }).join('');
    rows.push(`<tr><td class="time"><b>${i+1}교시</b>${escapeHtml(ref.start)}<br>${escapeHtml(ref.end)}</td>${tds}</tr>`);
  }
  document.getElementById('examTitle').textContent = `📝 ${exam.title} 시간표`;
  document.getElementById('examIntro').textContent = `${md(exam.start)} ~ ${md(exam.end)} · ${CLASS_GRADE}학년`;
  holder.innerHTML = `<div class="exam-table-wrap"><table class="exam-table"><thead><tr><th>시간</th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  section.style.display = 'block';
}

function pastNotices(){
  return ClassNoticeLogic.splitNotices(noticesForStudent(), todayStr()).past;
}
function currentNotices(){
  return ClassNoticeLogic.splitNotices(noticesForStudent(), todayStr()).current;
}

/* 학생이 안내를 확인했는지(읽음) 여부 - 이 브라우저에만 저장됨 */
const READ_KEY = 'classNoticeApp_readNotices';
function loadReadMap(){
  try{ return JSON.parse(localStorage.getItem(READ_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveReadMap(map){
  localStorage.setItem(READ_KEY, JSON.stringify(map));
}
function isNoticeRead(studentId, noticeId){
  const map = loadReadMap();
  return !!(map[studentId] && map[studentId][noticeId]);
}
function toggleNoticeRead(studentId, noticeId){
  const map = loadReadMap();
  if(!map[studentId]) map[studentId] = {};
  const newState = !map[studentId][noticeId];
  map[studentId][noticeId] = newState;
  saveReadMap(map);
  renderNotices();
  if(archiveOpen){
    const archiveEl = document.getElementById('archiveList');
    archiveEl.innerHTML = pastNotices().map(n => noticeCardHtml(n, {archived:true})).join('');
  }

  const student = currentStudent;
  const notice = notices.find(n => n.id === noticeId);
  if(student && notice){
    submitResponse('공지', notice.id, newState ? '확인' : '확인취소');
  }
}

function noticeCardHtml(n, opts){
  opts = opts || {};
  const identified = !!currentStudent;
  const read = identified && isNoticeRead(currentStudent.id, n.id);
  const unread = identified && !read;
  const checkboxHtml = identified
    ? `<input type="checkbox" class="notice-checkbox" ${read?'checked':''} onchange='toggleNoticeRead(${JSON.stringify(currentStudent.id)}, ${JSON.stringify(n.id)})'>`
    : `<span class="checkbox-placeholder" title="개인 코드 입력 후 확인 체크 가능">✓</span>`;
  const endDate = ClassNoticeLogic.noticeEndDate(n);
  const dateText = endDate && endDate !== n.date
    ? `안내 ${n.date} · ${endDate}까지`
    : `안내 ${n.date}`;
  return `
    <div class="notice-card ${n.urgent?'urgent':''} ${opts.archived?'archived':''} ${read?'done':''}">
      ${checkboxHtml}
      <div class="notice-body">
        <div class="ntitle">
          ${unread?'<span class="unread-dot"></span>':''}
          ${escapeHtml(n.title)}
          <span class="tag ${n.audience==='all'?'all':'personal'}">${n.audience==='all'?'전체':'개인'}</span>
          ${n.urgent?'<span class="tag urgent">중요</span>':''}
          ${unread?'<span class="tag new">안읽음</span>':''}
        </div>
        ${n.content ? `<div class="ncontent">${ClassNoticeContent.render(n.content)}</div>` : ''}
        <div class="ndate">${escapeHtml(dateText)}</div>
      </div>
    </div>
  `;
}

function renderNotices(){
  const current = currentNotices();
  const identified = !!currentStudent;
  const unreadCount = identified ? current.filter(n => !isNoticeRead(currentStudent.id, n.id)).length : 0;
  const badge = document.getElementById('noticeCount');
  badge.textContent = unreadCount>0 ? `안읽음 ${unreadCount}` : `${current.length}`;
  badge.className = 'badge' + (unreadCount>0 ? ' unread' : '');

  const el = document.getElementById('noticeList');
  el.innerHTML = current.length
    ? current.map(n => noticeCardHtml(n)).join('')
    : '<div class="empty-state">현재 확인할 안내사항이 없어요</div>';

  const past = pastNotices();
  const toggleBtn = document.getElementById('archiveToggle');
  toggleBtn.textContent = `지난 공지 보기 (${past.length})`;
  toggleBtn.style.display = past.length===0 ? 'none' : 'block';
  if(archiveOpen){
    const archiveEl = document.getElementById('archiveList');
    archiveEl.innerHTML = past.map(n => noticeCardHtml(n, {archived:true})).join('');
  }
}

let archiveOpen = false;
function toggleArchive(){
  archiveOpen = !archiveOpen;
  const archiveEl = document.getElementById('archiveList');
  const toggleBtn = document.getElementById('archiveToggle');
  if(archiveOpen){
    const past = pastNotices();
    archiveEl.innerHTML = past.map(n => noticeCardHtml(n, {archived:true})).join('');
    archiveEl.style.display = 'block';
    toggleBtn.textContent = '지난 공지 숨기기';
  } else {
    archiveEl.style.display = 'none';
    toggleBtn.textContent = `지난 공지 보기 (${pastNotices().length})`;
  }
}

/* 확인/완료 응답은 같은 Apps Script의 앱_학생응답 시트에 기록한다. */
function submitResponse(itemType, itemId, response){
  const code = localStorage.getItem(MYCODE_KEY) || '';
  if(!code) return;
  fetch(SHEET_API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'recordResponse', code, itemType, itemId, response})
  }).catch(()=>{});
}

/* ===================== 달력 ===================== */
function holidayTitle(dateStr){
  if(typeof holidays === 'undefined') return null;
  const h = holidays.find(x => x.date === dateStr);
  return h ? h.title : null;
}

function dowOf(dateStr){
  return new Date(dateStr + 'T00:00:00').getDay();
}

function specialRangeFor(dateStr){
  if(typeof specialRanges === 'undefined') return null;
  const r = specialRanges.find(r => dateStr >= r.start && dateStr <= r.end);
  if(!r) return null;
  if(r.type === 'exam'){
    const dow = dowOf(dateStr);
    if(dow === 0 || dow === 6) return null; // 고사기간은 주말 제외
  }
  return r;
}

function vacationRangeFor(dateStr){
  if(typeof vacationRanges === 'undefined') return null;
  return vacationRanges.find(r => dateStr >= r.start && dateStr <= r.end) || null;
}

// 실제로 회색 처리해야 하는지 여부 (weekdayOnly면 주말/공휴일은 회색 제외)
function isGreyedOut(dateStr){
  const v = vacationRangeFor(dateStr);
  if(!v) return false;
  if(v.weekdayOnly){
    const dow = dowOf(dateStr);
    if(dow === 0 || dow === 6) return false;
    if(holidayTitle(dateStr)) return false;
  }
  return true;
}

function academicEventDates(){
  // 달력은 data.js의 학사일정만 사용한다. 공지·할 일은 별도 요청 없이 합치지 않는다.
  const dates = new Set();
  if(typeof calendarEvents !== 'undefined'){
    calendarEvents.forEach(e=>dates.add(e.date));
  }
  if(typeof holidays !== 'undefined'){
    holidays.forEach(h=>dates.add(h.date));
  }
  if(typeof specialRanges !== 'undefined'){
    specialRanges.forEach(r=>{
      let d = r.start;
      while(d <= r.end){
        const dow = dowOf(d);
        const skipWeekend = r.type === 'exam' && (dow === 0 || dow === 6);
        if(!skipWeekend) dates.add(d);
        d = fmtDate(new Date(new Date(d).getTime() + 86400000));
      }
    });
  }
  // 회색(방학/정리기간) 처리되는 날짜는 일정 표시에서 제외
  [...dates].forEach(d=>{ if(isGreyedOut(d)) dates.delete(d); });
  return dates;
}

let selectedDate = null;
function showDayDetail(dateStr){
  if(isGreyedOut(dateStr)) return;
  selectedDate = dateStr;
  renderCalendar();

  const items = [];
  const holiday = holidayTitle(dateStr);
  if(holiday) items.push(`🔴 [공휴일] ${holiday}`);
  const range = specialRangeFor(dateStr);
  if(range) items.push(`🏫 ${range.title}`);
  if(typeof calendarEvents !== 'undefined'){
    calendarEvents.filter(e=>e.date===dateStr).forEach(e=>items.push(`🏫 ${e.title}`));
  }
  const detail = document.getElementById('dayDetail');
  const title = document.getElementById('dayDetailTitle');
  const list = document.getElementById('dayDetailList');
  const d = new Date(dateStr);
  title.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 학사일정`;
  list.innerHTML = items.length
    ? items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')
    : '<li>등록된 학사일정이 없어요</li>';
  detail.style.display = 'block';
}

function changeMonth(diff){
  calDate.setMonth(calDate.getMonth()+diff);
  selectedDate = null;
  document.getElementById('dayDetail').style.display = 'none';
  renderCalendar();
}

function goToToday(){
  calDate = new Date();
  const t = todayStr();
  if(isGreyedOut(t)){
    selectedDate = null;
    document.getElementById('dayDetail').style.display = 'none';
    renderCalendar();
  } else {
    showDayDetail(t);
  }
}

function openMonthJump(){
  const input = document.getElementById('monthJumpInput');
  const label = document.getElementById('calYm');
  const y = calDate.getFullYear(), m = String(calDate.getMonth()+1).padStart(2,'0');
  input.value = `${y}-${m}`;
  label.style.display = 'none';
  input.style.display = 'inline-block';
  input.focus();
  if(input.showPicker){ try{ input.showPicker(); }catch(e){} }
}

function hideMonthJump(){
  document.getElementById('monthJumpInput').style.display = 'none';
  document.getElementById('calYm').style.display = 'block';
}

function jumpToMonth(value){
  if(!value) { hideMonthJump(); return; }
  const [y,m] = value.split('-').map(Number);
  calDate = new Date(y, m-1, 1);
  selectedDate = null;
  document.getElementById('dayDetail').style.display = 'none';
  hideMonthJump();
  renderCalendar();
}

function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calYm').textContent = `${y}년 ${m+1}월`;

  const dows = ['일','월','화','수','목','금','토'];
  const firstDay = new Date(y,m,1).getDay();
  const lastDate = new Date(y,m+1,0).getDate();
  const eventDates = academicEventDates();
  const today = todayStr();

  let html = dows.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++){ html += `<div class="cal-day empty"></div>`; }
  for(let d=1; d<=lastDate; d++){
    const dateStr = fmtDate(new Date(y,m,d));
    const dow = new Date(y,m,d).getDay();
    const isToday = dateStr===today;
    const isSelected = dateStr===selectedDate;
    const holidayObj = (typeof holidays !== 'undefined') ? holidays.find(h=>h.date===dateStr) : null;
    const greyedOut = isGreyedOut(dateStr);
    const range = specialRangeFor(dateStr);
    const hasEvent = !greyedOut && eventDates.has(dateStr);
    const alwaysEvent = (!greyedOut && typeof calendarEvents !== 'undefined')
      ? calendarEvents.find(e => e.date===dateStr && e.alwaysShow)
      : null;
    const shortLabel = greyedOut ? '' : (holidayObj ? (holidayObj.short || holidayObj.title) : (alwaysEvent ? (alwaysEvent.short || alwaysEvent.title) : ''));

    let classes = ['cal-day'];
    if(isToday) classes.push('today');
    if(isSelected) classes.push('selected');
    if(shortLabel) classes.push('has-label');
    if(greyedOut){
      classes.push('range-vacation');
    } else {
      if(dow===0) classes.push('sunday');
      if(dow===6) classes.push('saturday');
      if(holidayObj) classes.push('holiday');
      if(holidayObj) classes.push('range-holiday');
      else if(range && range.type==='exam') classes.push('range-exam');
      else if(range && range.type==='prep') classes.push('range-prep');
      else if(hasEvent) classes.push('has-event');
    }

    const clickAttr = (hasEvent && !greyedOut) ? `onclick="showDayDetail('${dateStr}')"` : '';
    const dot = (hasEvent && !isToday && !greyedOut && !shortLabel) ? '<span class="dot"></span>' : '';
    const labelHtml = shortLabel ? `<span class="day-label">${shortLabel}</span>` : '';
    html += `<div class="${classes.join(' ')}" ${clickAttr}>${d}${labelHtml}${dot}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

/* 헤더가 sticky라, 같이 고정되는 오른쪽 칸의 top을 헤더 높이에 맞춰 둔다.
   글씨 크기·화면 폭에 따라 헤더가 두 줄이 되기도 해서 실제 높이를 재서 쓴다. */
function trackHeaderHeight(){
  const header = document.querySelector('header');
  if(!header) return;
  const apply = () => document.documentElement.style
    .setProperty('--header-h', `${Math.round(header.getBoundingClientRect().height)}px`);
  apply();
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(apply).observe(header);
  else window.addEventListener('resize', apply);
}

/* ===================== 시작 ===================== */
async function init(){
  const now = new Date();
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 기준 안내`;
  renderCalendar();      // 달력은 정적 data.js라 항상 표시
  renderExamSchedule();  // 고사 시간표도 정적 data.js라 네트워크와 무관하게 표시
  renderStudyLinks();    // 학습링크도 정적 data.js
  trackHeaderHeight();   // 고정된 오른쪽 칸이 헤더에 가리지 않도록
  renderIdentityBox();   // 로그인 입력창을 즉시 표시(네트워크 대기 전)
  const savedCode = localStorage.getItem(MYCODE_KEY) || '';
  try{
    await loadData(savedCode);
    renderIdentityBox();
    renderClassTimetable();
    renderNotices();
  }catch(e){
    currentStudent = null;
    renderIdentityBox();
    showConnError();
  }
}
init();
</script>
